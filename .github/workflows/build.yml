name: Build easy_zh2en

# easy_zh2en builds its own APK here (upstream's publish / F-Droid / nix workflows are removed).
# Push to master or run by hand: APK lands in the run's artifacts. Push a tag v*: also published as a Release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          packages: cmake;3.31.6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK (arm64)
        env:
          BUILD_ABI: arm64-v8a
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
        run: |
          # tag builds are named after the tag (v0.1.0 -> 0.1.0) instead of git describe
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export BUILD_VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          ./gradlew :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir out
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp app/build/outputs/apk/release/*.apk "out/easy_zh2en-${GITHUB_REF_NAME#v}-arm64.apk"
          else
            cp app/build/outputs/apk/release/*.apk out/
          fi
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: easy_zh2en
          path: out/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" out/*.apk --title "easy_zh2en $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" out/*.apk --title "easy_zh2en $GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA"
          fi
